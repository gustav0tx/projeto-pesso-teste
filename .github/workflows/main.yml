name: CI - Estoque de Livros  

on:
  push:
    branches:
      - main        
      - develop     
  pull_request:
    branches:
      - main        

env:
  NODE_VERSION: "18"        
  PROJECT_NAME: "livraria"  

jobs:

  test:
    name: Rodar Testes Automatizados   
    runs-on: ubuntu-latest                

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"  

      - name: Instalar dependências
        run: npm install

      - name:  Executar testes Jest
        run: npm test

  build:
    name:  Build e Verificação
    runs-on: ubuntu-latest
    needs: test 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Instalar dependências
        run: npm install

      - name: Verificar estrutura do projeto
        run: |
          echo "Verificando arquivos do projeto ${{ env.PROJECT_NAME }}..."
          test -f database/livroDatabase.js && echo "livroDatabase.js OK"
          test -f services/livroService.js  && echo "livroService.js OK"
          test -f controllers/livroController.js && echo "livroController.js OK"
          test -f test/livroService.test.js && echo "livroService.test.js OK"
          echo "Estrutura do projeto validada com sucesso!"

      - name:  Simular empacotamento
        run: |
          echo "Build do projeto ${{ env.PROJECT_NAME }} concluído!"
          echo "Node: $(node --version)"
          echo "NPM:  $(npm --version)"